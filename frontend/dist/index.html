<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>FlipMuncher</title>
<link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <img src="mascot.png" alt="" class="brand-mark" />
    <div class="brand-text">
      <h1>FlipMuncher</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="tools">
      <button id="langBtn" class="icon-btn lang-btn" data-i18n-attr="title:language,aria-label:language" aria-haspopup="menu" aria-expanded="false">EN</button>
      <div id="langMenu" class="lang-menu hidden" role="menu"></div>
      <button id="themeBtn" class="icon-btn" data-i18n-attr="title:theme,aria-label:theme">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23Z"/></svg>
      </button>
      <button id="aboutBtn" class="icon-btn" data-i18n-attr="title:about,aria-label:about" aria-haspopup="dialog">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg>
      </button>
    </div>
  </header>

  <img class="hero-mascot" src="mascot.png" alt="" />

  <main class="main">
    <div class="column">
      <section class="intake">
        <div class="stats">
          <div class="stat"><span data-i18n="statQueue"></span><b id="statQueue">0</b></div>
          <div class="stat"><span data-i18n="statDone"></span><b id="statDone">0</b></div>
          <div class="stat"><span data-i18n="statSize"></span><b id="statSize">—</b></div>
        </div>

        <div class="field-box" id="fieldBox">
          <textarea id="urls" rows="3" spellcheck="false" data-i18n-attr="aria-label:urlsAria" placeholder="https://online.anyflip.com/xxxx/yyyy/"></textarea>
          <div class="field-foot">
            <span id="linkHint" class="hint" data-i18n="linkHint"></span>
            <input type="hidden" id="outputDir" />
            <button id="destBtn" class="dest-btn" data-i18n-attr="title:destChange">
              <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"/></svg>
              <span id="destText"></span>
            </button>
            <button id="advancedLink" class="link-btn" data-i18n-attr="title:advancedTitle" data-i18n="advanced" aria-haspopup="dialog"></button>
            <span class="kbd" data-i18n-attr="title:kbdTitle">Ctrl + Enter</span>
          </div>
        </div>

        <ul id="previewList" class="preview-list hidden"></ul>

        <div id="previewActions" class="preview-actions hidden">
          <button id="addMoreBtn" class="link-btn" data-i18n="addMore"></button>
          <button id="addBtn" class="btn btn-primary btn-lg" disabled>
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" style="transform:rotate(90deg)"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
            <span id="addLabel"></span>
          </button>
        </div>

        <p id="emptyQueue" class="empty-note" data-i18n="emptyNote"></p>
      </section>

      <section id="queueSection" class="queue-section hidden">
        <div class="queue-head">
          <h2 data-i18n="queueTitle"></h2>
          <span id="counts" class="counts" aria-live="polite"></span>
        </div>
        <ol id="queue" class="queue"></ol>
      </section>
    </div>
  </main>

  <footer class="statusbar">
    <span class="status" role="status" aria-live="polite"><span id="statusDot" class="dot" aria-hidden="true"></span><span id="statusText"></span></span>
  </footer>

  <!-- Settings sheet -->
  <div id="settingsLayer" class="sheet-layer hidden">
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <h2 id="settingsTitle" data-i18n="settingsTitle"></h2>
        <button id="closeSettingsBtn" class="icon-btn" data-i18n-attr="aria-label:closeSettings">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="group">
          <h3 data-i18n="groupPerf"></h3>
          <p class="group-hint" data-i18n="perfHint"></p>
          <div class="grid">
            <label class="num"><span data-i18n="threads"></span><input id="threads" class="input mono" type="number" min="1" max="16" /></label>
            <label class="num"><span data-i18n="retries"></span><input id="retries" class="input mono" type="number" min="0" max="10" /></label>
            <label class="num"><span data-i18n="retryDelay"></span><input id="retryDelay" class="input mono" type="number" min="0" step="0.1" /></label>
            <label class="num"><span data-i18n="chunkSize"></span><input id="chunkSize" class="input mono" type="number" min="1" max="200" /></label>
          </div>
        </div>

        <div class="group">
          <h3 data-i18n="groupImages"></h3>
          <label class="switch-row"><span data-i18n="keepImages"></span><input id="keepImages" type="checkbox" role="switch" class="switch" /></label>
          <label class="switch-row"><span><span data-i18n="compress"></span><small data-i18n="compressHint"></small></span><input id="compressImages" type="checkbox" role="switch" class="switch" /></label>
          <div id="qualityRow" class="quality-row">
            <label for="jpegQuality" class="small-label" data-i18n="jpegQuality"></label>
            <input id="jpegQuality" type="range" min="1" max="100" />
            <span id="jpegQualityVal" class="mono">60</span>
          </div>
          <div id="sizeEst" class="est" aria-live="polite">
            <p id="estHead" class="est-head"></p>
            <div id="estRows" class="est-rows"></div>
            <p id="estNote" class="est-note"></p>
          </div>
        </div>
      </div>
      <div class="sheet-foot">
        <span id="saveMsg" class="save-msg" role="status" aria-live="polite"></span>
        <button id="saveConfigBtn" class="btn btn-primary" data-i18n="saveSettings"></button>
      </div>
    </aside>
  </div>

  <!-- About -->
  <div id="aboutModal" class="dialog-layer hidden">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <div class="about-head">
        <img src="appicon.png" alt="" />
        <div>
          <div id="aboutTitle" class="dialog-title">FlipMuncher</div>
          <div class="about-meta"><span id="aboutVersion" class="tag mono">v0</span><span id="aboutLicense">GNU General Public License v3.0</span></div>
        </div>
      </div>
      <p><span data-i18n="basedOn"></span> <strong>anyflip-downloader</strong> <span data-i18n="byAuthor"></span> <a id="aboutUpstreamLink" href="#">github.com/Lofter1/anyflip-downloader</a></p>
      <p id="aboutNotice" class="muted"></p>
      <p class="rights" data-i18n="rights"></p>
      <p class="support">
        <a id="coffeeLink" href="https://buymeacoffee.com/matthewuwu" target="_blank" rel="noopener" data-i18n="coffee"></a>
      </p>
      <h3 class="kicker" data-i18n="license"></h3>
      <pre id="licenseText" class="license-box"></pre>
      <div class="dialog-actions"><button id="closeAboutBtn" class="btn btn-secondary" data-i18n="close"></button></div>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
