name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Windows binary
        run: CGO_ENABLED=0 wails build -platform windows/amd64 -clean -ldflags "-X main.appVersion=${TAG#v}"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full binutils

      - name: Bundle portable WebView2 runtime and OCR
        run: bash scripts/package-windows-release.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            FlipMuncher-portable.zip
            FlipMuncher-windows-lite.zip
          generate_release_notes: false
          prerelease: false

  build-linux:
    permissions:
      contents: write
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Wails CLI and GTK/WebKit dev headers
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Build Linux binary
        # Ubuntu 24.04 only ships libwebkit2gtk-4.1-dev (4.0 is gone);
        # this tag switches Wails' pkg-config lookup to match.
        run: CGO_ENABLED=1 wails build -platform linux/amd64 -tags webkit2_41 -clean -ldflags "-X main.appVersion=${TAG#v}"

      - name: Install appimagetool
        run: |
          # Pinned release (not "continuous"); checksum verified.
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool

      - name: Bundle portable Tesseract OCR and package
        env:
          # GitHub-hosted runners have no FUSE; appimagetool needs this
          # to run without it.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/package-linux-release.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            FlipMuncher-linux-portable.tar.gz
            FlipMuncher-x86_64.AppImage
          generate_release_notes: false
          prerelease: false

  build-macos:
    permissions:
      contents: write
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build macOS app
        run: CGO_ENABLED=1 wails build -platform darwin/universal -clean -ldflags "-X main.appVersion=${TAG#v}"

      - name: Bundle portable Tesseract OCR and package
        run: bash scripts/package-macos-release.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: FlipMuncher-macos.zip
          generate_release_notes: false
          prerelease: false
